<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Ambiente Decor Adm</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container-fluid mt-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">
                            <i class="fas fa-id-card me-2 text-marrom-escuro"></i>Meu Perfil
                        </h4>
                    </div>
                    <div class="card-body">
                        <div id="perfilAlert" class="alert d-none" role="alert"></div>

                        <form id="perfilForm" class="row g-3">
                            <div class="col-md-6">
                                <label for="perfilNome" class="form-label">Nome</label>
                                <input id="perfilNome" type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="perfilEmail" class="form-label">E-mail</label>
                                <input id="perfilEmail" type="email" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="perfilCpf" class="form-label">CPF</label>
                                <input id="perfilCpf" type="text" class="form-control" readonly>
                            </div>
                            <div class="col-md-4">
                                <label for="perfilTelefone" class="form-label">Telefone</label>
                                <input id="perfilTelefone" type="text" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="perfilNivel" class="form-label">Nivel</label>
                                <input id="perfilNivel" type="text" class="form-control" readonly>
                            </div>
                            <div class="col-md-6">
                                <label for="perfilDataNascimento" class="form-label">Data de nascimento</label>
                                <input id="perfilDataNascimento" type="date" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="perfilAtualizadoEm" class="form-label">Ultima atualizacao</label>
                                <input id="perfilAtualizadoEm" type="text" class="form-control" readonly>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                <button id="perfilVoltarBtn" type="button" class="btn btn-outline-secondary">Voltar</button>
                                <button id="perfilSalvarBtn" type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>Salvar Perfil
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/perfil.js"></script>
</body>
</html>
