<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Endereco - Ambiente Decor Adm</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container-fluid mt-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h4 class="mb-0">
                            <i class="fas fa-map-location-dot me-2 text-marrom-escuro"></i>
                            Teste Endereco
                        </h4>
                        <span class="badge text-bg-light border">ViaCEP</span>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info mb-4">
                            Informe o CEP e clique em buscar para completar os campos de endereco automaticamente.
                        </div>

                        <div id="testeEnderecoAlert" class="alert d-none" role="alert"></div>

                        <form id="testeEnderecoForm" novalidate>
                            <div class="row g-3">
                                <div class="col-12 col-lg-4">
                                    <label for="testeEnderecoCep" class="form-label">CEP</label>
                                    <div class="input-group">
                                        <input id="testeEnderecoCep" type="text" class="form-control" maxlength="9" inputmode="numeric" placeholder="00000-000">
                                        <button id="testeEnderecoBuscarBtn" type="button" class="btn btn-primary">
                                            <i class="fas fa-search me-1"></i>Buscar CEP
                                        </button>
                                    </div>
                                    <div id="testeEnderecoStatus" class="form-text"></div>
                                </div>

                                <div class="col-12 col-lg-8">
                                    <label for="testeEnderecoLogradouro" class="form-label">Endereco</label>
                                    <input id="testeEnderecoLogradouro" type="text" class="form-control" placeholder="Rua, avenida, etc.">
                                </div>

                                <div class="col-12 col-md-3">
                                    <label for="testeEnderecoNumero" class="form-label">Numero</label>
                                    <input id="testeEnderecoNumero" type="text" class="form-control" placeholder="123">
                                </div>

                                <div class="col-12 col-md-5">
                                    <label for="testeEnderecoComplemento" class="form-label">Complemento</label>
                                    <input id="testeEnderecoComplemento" type="text" class="form-control" placeholder="Apto, bloco, sala...">
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="testeEnderecoBairro" class="form-label">Bairro</label>
                                    <input id="testeEnderecoBairro" type="text" class="form-control" placeholder="Bairro">
                                </div>

                                <div class="col-12 col-md-8">
                                    <label for="testeEnderecoCidade" class="form-label">Cidade</label>
                                    <input id="testeEnderecoCidade" type="text" class="form-control" placeholder="Cidade">
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="testeEnderecoEstado" class="form-label">Estado</label>
                                    <input id="testeEnderecoEstado" type="text" class="form-control text-uppercase" maxlength="2" placeholder="UF">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button id="testeEnderecoLimparBtn" type="button" class="btn btn-outline-secondary">
                                    <i class="fas fa-eraser me-1"></i>Limpar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/teste-endereco.js"></script>
</body>
</html>
